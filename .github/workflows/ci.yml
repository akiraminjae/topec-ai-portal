name: CI

# 기본 검증 파이프라인 — 실제 배포는 하지 않고, 프론트엔드/백엔드가 최소한 정상적으로
# 빌드·임포트되는지만 확인합니다. 이 프로젝트엔 아직 자동화 테스트가 없어(TODO) 지금은
# 타입체크/빌드/모듈 임포트 수준의 검증입니다.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  backend-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - services/document_service
          - services/knowledge_service
          - services/agent_lifecycle_service
          - services/observability_service
          - services/governance_service
          - services/auth_service
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/${{ matrix.service }}/requirements.txt
      - run: pip install -r requirements.txt
      # DATABASE_URL 미설정 시 SQLite로 자동 폴백되므로 외부 DB 없이도 import가 성공해야 합니다.
      - run: python -c "import main"

  hwp-parser-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/services/hwp_parser_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/services/hwp_parser_service/package-lock.json
      - run: npm ci
      - run: node --check server.js
